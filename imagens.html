<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Galeria do Ric</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1: #0f1724; /* deep */
      --bg2: #0b1220; /* deep */
      --card: rgba(255,255,255,0.06);
      --glass: rgba(255,255,255,0.06);
      --accent: 200, 160, 255; /* used with rgba() and hsl() */
      --radius: 14px;
      --gap: 18px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background: linear-gradient(180deg,var(--bg1),var(--bg2));
      color: #e6eef8;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:40px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }

    .container{
      width:min(1200px,95%);
    }

    .cabecalho{
      display:flex;align-items:center;gap:16px;margin-bottom:20px;
    }
    .logo{
      width:54px;height:54px;border-radius:12px;background:linear-gradient(135deg, rgba(var(--accent),0.18), rgba(255,255,255,0.02));
      display:flex;align-items:center;justify-content:center;font-weight:700;color:rgba(255,255,255,0.95);
      box-shadow: 0 6px 18px rgba(2,6,23,0.6);
      backdrop-filter: blur(6px) saturate(120%);
    }
    h1{font-size:18px;margin:0}
    p.sub{margin:0;color:rgba(230,238,248,0.64);font-size:13px}

    /* Grid */
    .galeria{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:var(--gap);
      margin-top:18px;
    }

    .card{
      border-radius:var(--radius);
      overflow:hidden;
      position:relative;
      cursor:pointer;
      transition:transform .35s cubic-bezier(.2,.9,.3,1), box-shadow .25s;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      box-shadow: 0 6px 18px rgba(2,6,23,0.6);
      backdrop-filter: blur(8px) saturate(110%);
      border: 1px solid rgba(255,255,255,0.03);
    }

    .card:hover{transform:translateY(-6px) scale(1.01); box-shadow: 0 18px 34px rgba(2,6,23,0.75)}

    .thumb{
      display:block;width:100%;height:170px;object-fit:cover;
      vertical-align:middle;transition:transform .5s ease;
    }
    .card:hover .thumb{transform:scale(1.06)}

    .meta{
      padding:12px 14px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
      display:flex;flex-direction:column;gap:6px;
    }
    .titulo{font-weight:600;font-size:14px}
    .descricao{font-size:12px;color:rgba(230,238,248,0.66)}

    /* Tag pequena */
    .tag{
      position:absolute;top:12px;left:12px;padding:6px 10px;border-radius:999px;font-size:12px;
      background:rgba(0,0,0,0.25);backdrop-filter: blur(6px);border:1px solid rgba(255,255,255,0.04)
    }

    /* Modal */
    .modal{
      position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;
    }
    .modal.ativo{display:flex}
    .overlay{
      position:absolute;inset:0;background:linear-gradient(180deg, rgba(2,6,23,0.6), rgba(2,6,23,0.86));
      backdrop-filter: blur(4px);
    }
    .lightbox{
      position:relative;max-width:1100px;width:95%;max-height:90vh;border-radius:12px;overflow:hidden;
      box-shadow:0 30px 80px rgba(2,6,23,0.8);display:flex;align-items:center;justify-content:center;
      background: rgba(9,12,18,0.48);backdrop-filter: blur(10px) saturate(120%);
      border:1px solid rgba(255,255,255,0.04);
    }
    .lightbox img{width:100%;height:auto;max-height:86vh;object-fit:contain;display:block}

    .controles{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:18px;pointer-events:none
    }
    .botao{
      pointer-events:auto;border-radius:999px;padding:10px 12px;background:rgba(0,0,0,0.28);border:1px solid rgba(255,255,255,0.04);
      display:flex;align-items:center;justify-content:center;font-size:18px;color:inherit;cursor:pointer;transition:transform .15s
    }
    .botao:hover{transform:scale(1.04)}

    .fechar{
      position:absolute;top:12px;right:12px;pointer-events:auto;padding:8px;border-radius:10px;background:rgba(0,0,0,0.22);border:1px solid rgba(255,255,255,0.04)
    }

    /* Responsivo */
    @media (max-width:600px){
      .thumb{height:140px}
      body{padding:18px}
      .logo{width:44px;height:44px}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="cabecalho">
      <div class="logo"><a href="index.html" style="text-decoration: none; color: white;">Voltar</a></div>
      <div>
        <h1>Minha Galeria</h1>
        <p class="sub">Uma foto a cada 20 anos.</p>
      </div>
    </div>

    <div class="galeria" id="galeria">
      <!-- Exemplo de cards: altere os src para suas imagens -->
      <div class="card" data-titulo="" data-descricao="">
        <span class="tag">Pessoal</span>
        <img class="thumb" src="image5.png" alt="Projeto A">
        <div class="meta">
          <div class="titulo">Ric</div>
          <div class="descricao"></div>
        </div>
      </div>

      <div class="card" data-titulo="Projeto B" data-descricao="">
        <span class="tag">Pessoal</span>
        <img class="thumb" src="image6.png" alt="">
        <div class="meta">
          <div class="titulo">Ric</div>
          <div class="descricao"></div>
        </div>
      </div>

      <div class="card" data-titulo="" data-descricao="">
        <span class="tag">Pessoal</span>
        <img class="thumb" src="image7.png" alt="Projeto C">
        <div class="meta">
          <div class="titulo">Ric</div>
          <div class="descricao"></div>
        </div>
      </div>

      <div class="card" data-titulo="" data-descricao="">
        <span class="tag">Pessoal</span>
        <img class="thumb" src="image4.png" alt="Projeto D">
        <div class="meta">
          <div class="titulo">Ric</div>
          <div class="descricao"></div>
        </div>
      </div>

      <div class="card" data-titulo="" data-descricao="">
        <span class="tag">Arte</span>
        <img class="thumb" src="image.png" alt="Projeto D">
        <div class="meta">
          <div class="titulo">Ric</div>
          <div class="descricao"></div>
        </div>
      </div>

      <div class="card" data-titulo="" data-descricao="">
        <span class="tag">Arte</span>
        <img class="thumb" src="image2.png" alt="Projeto D">
        <div class="meta">
          <div class="titulo">Ric</div>
          <div class="descricao"></div>
        </div>
      </div>

      <div class="card" data-titulo="" data-descricao="">
        <span class="tag">Arte</span>
        <img class="thumb" src="image3.png" alt="Projeto D">
        <div class="meta">
          <div class="titulo">Ric</div>
          <div class="descricao"></div>
        </div>
      </div>

      <!-- Repita os cards conforme precisar -->
    </div>
  </div>

  <!-- Modal / Lightbox -->
  <div class="modal" id="modal">
    <div class="overlay" id="overlay"></div>
    <div class="lightbox" role="dialog" aria-modal="true">
      <button class="fechar" id="fechar" aria-label="Fechar">✕</button>
      <div class="controles">
        <button class="botao" id="prev" aria-label="Anterior">◀</button>
        <button class="botao" id="next" aria-label="Próximo">▶</button>
      </div>
      <img id="lightImg" src="" alt="Visualização">
    </div>
  </div>

  <script>
    // Seleções (nomes em português)
    const galeria = document.getElementById('galeria');
    const modal = document.getElementById('modal');
    const overlay = document.getElementById('overlay');
    const fechar = document.getElementById('fechar');
    const imagemLight = document.getElementById('lightImg');
    const btnPrev = document.getElementById('prev');
    const btnNext = document.getElementById('next');

    const cards = Array.from(galeria.querySelectorAll('.card'));
    let indiceAtual = 0;

    function abrirModal(indice){
      const card = cards[indice];
      const img = card.querySelector('.thumb');
      const titulo = card.dataset.titulo || '';
      const desc = card.dataset.descricao || '';
      imagemLight.src = img.src;
      imagemLight.alt = titulo + ' — ' + desc;
      indiceAtual = indice;
      modal.classList.add('ativo');
      document.body.style.overflow = 'hidden';
    }

    function fecharModal(){
      modal.classList.remove('ativo');
      document.body.style.overflow = '';
      imagemLight.src = '';
    }

    function mostrarAnterior(){
      indiceAtual = (indiceAtual - 1 + cards.length) % cards.length;
      abrirModal(indiceAtual);
    }
    function mostrarProximo(){
      indiceAtual = (indiceAtual + 1) % cards.length;
      abrirModal(indiceAtual);
    }

    // adiciona eventos
    cards.forEach((card, i) => {
      card.addEventListener('click', () => abrirModal(i));
    });

    overlay.addEventListener('click', fecharModal);
    fechar.addEventListener('click', fecharModal);

    btnPrev.addEventListener('click', (e)=>{ e.stopPropagation(); mostrarAnterior(); });
    btnNext.addEventListener('click', (e)=>{ e.stopPropagation(); mostrarProximo(); });

    // atalhos de teclado
    document.addEventListener('keydown', (e) => {
      if(!modal.classList.contains('ativo')) return;
      if(e.key === 'Escape') fecharModal();
      if(e.key === 'ArrowLeft') mostrarAnterior();
      if(e.key === 'ArrowRight') mostrarProximo();
    });

    // função utilitária: permitir trocar as imagens por URLs próprias com dataset
    // Ex: <div class="card" data-src="/meu-projeto/preview.jpg" ...>
    cards.forEach(card => {
      const srcPersonalizado = card.dataset.src;
      if(srcPersonalizado){
        const img = card.querySelector('.thumb');
        img.src = srcPersonalizado;
      }
    });
  </script>
</body>
</html>
